services:
  server:
    image: ghcr.io/se2gruppe3/saboteur:latest

    restart: unless-stopped

    ports:
      - "53207:8080"


    volumes:
      - saboteur_data:/data
      - /home/grp-3/.env:/app/.env

    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 768M
        reservations:
          memory: 512M

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  saboteur_data: