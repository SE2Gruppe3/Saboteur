spring.application.name=server

# Erlaubt Zugriff von außen (Handy/Laptop-Browser)
server.address=0.0.0.0
server.port=8080

# H2 Datenbank Setup - Persistent for Docker volume
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:${user.home}/.saboteur/saboteur_db};DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# Hibernate Setup - 'update' instead of 'create-drop' to keep data
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# CRITICAL: Verhindert die fehlerhafte Metadaten-Abfrage beim Start
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.properties.hibernate.boot.registry.selector.default_dialect=org.hibernate.dialect.H2Dialect

# H2-Konsole für den Check
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# --- SPRING BOOT ACTUATOR CONFIGURATION ---
# Alle Endpoints aktivieren (Health, Info, etc.)
management.endpoints.web.exposure.include=health,info,liveness,readiness,prometheus

# Info Endpoint Details
management.info.build.enabled=true
management.info.git.enabled=true
management.info.git.mode=full

# Health Details immer anzeigen (UP/DOWN + Details)
management.endpoint.health.show-details=always

# Komponenten einzeln abfragbar machen (db, diskSpace, etc.)
management.endpoint.health.show-components=always

# Liveness und Readiness Probes für Kubernetes/Docker aktivieren
management.endpoint.health.probes.enabled=true

# Gruppen definieren
management.endpoint.health.group.readiness.include=db,diskSpace,gameSystem
management.endpoint.health.group.liveness.include=ping
