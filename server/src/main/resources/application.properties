spring.application.name=server

# Erlaubt Zugriff von außen (Handy/Laptop-Browser)
server.address=0.0.0.0
server.port=8080

# H2 Datenbank Setup (Dateibasiert für Persistenz)
spring.datasource.url=jdbc:h2:file:./data/saboteur_db;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# Hibernate Konfiguration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# CRITICAL: Verhindert die fehlerhafte Metadaten-Abfrage beim Start
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.properties.hibernate.boot.registry.selector.default_dialect=org.hibernate.dialect.H2Dialect

# H2-Konsole für den Check
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true
